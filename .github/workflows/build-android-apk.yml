name: Build Android APK

on:
  push:
    branches:
      - 'claude/android-photo-recovery-app-47sfK'
      - main
    paths:
      - 'android-photo-recovery/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: android-photo-recovery
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-photo-recovery/app/build/outputs/apk/debug/app-debug.apk RecuperarFotos.apk

      - name: Publicar APK en Releases (descarga directa)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes 2>/dev/null || true
          gh release create apk-latest \
            --repo deepanalytica/app \
            --title "RecuperarFotos - APK descargable" \
            --notes "## RecuperarFotos APK\n\n**Requiere Android 11+**\n\n### Instrucciones:\n1. Descarga \`RecuperarFotos.apk\`\n2. Abre el archivo en tu Xiaomi\n3. Si pide \"fuentes desconocidas\" → Activar\n4. Instala y abre la app" \
            --prerelease \
            RecuperarFotos.apk

      - name: Upload artifact (respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: RecuperarFotos-APK
          path: RecuperarFotos.apk
          retention-days: 30
