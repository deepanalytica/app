name: Build Android APK

on:
  push:
    branches:
      - 'claude/android-photo-recovery-app-47sfK'
      - main
    paths:
      - 'android-photo-recovery/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Grant execute permission for gradlew (if present)
        working-directory: android-photo-recovery
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        working-directory: android-photo-recovery
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mv android-photo-recovery/app/build/outputs/apk/debug/app-debug.apk \
             android-photo-recovery/app/build/outputs/apk/debug/RecuperarFotos-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecuperarFotos-APK
          path: android-photo-recovery/app/build/outputs/apk/debug/RecuperarFotos-debug.apk
          retention-days: 30

      - name: APK info
        run: |
          echo "=== APK generado exitosamente ==="
          ls -lh android-photo-recovery/app/build/outputs/apk/debug/*.apk
          echo "Descarga el APK desde la pestaña Actions > Artifacts"
