name: Build Audio Player APK

on:
  push:
    paths:
      - 'android-audio-player/**'
      - '.github/workflows/build-audio-player-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        working-directory: android-audio-player
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Build APK
        working-directory: android-audio-player
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android-audio-player -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayer-APK
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete audio-player-latest --yes 2>/dev/null || true
          gh release create audio-player-latest \
            --title "Audio Player APK" \
            --notes "Reproductor de audio con ecualizador, compresor y soporte para todos los formatos." \
            "${{ steps.find_apk.outputs.apk_path }}#AudioPlayer.apk"
